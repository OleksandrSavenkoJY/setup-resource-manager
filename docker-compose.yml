services:
  postgres:
    image: postgres:16
    container_name: setup-resource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: setup-resource-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: setup-resource-frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3001:3000"

  mcp:
    build:
      context: ./mcp
    container_name: setup-resource-mcp
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${MCP_BIND:-127.0.0.1}:8765:8765"

volumes:
  postgres_data:
